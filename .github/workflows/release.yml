name: Publish GitHub release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or repair after committing its compiled ZIP
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tools, notes and compiled packages
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: release-tools
          persist-credentials: false

      - name: Check out the tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source
          persist-credentials: false

      - name: Require a verified installable package
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Expected a release tag such as v1.1.0.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $manifest = Get-Content source/ICGNS/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.Version -ne $version) { throw 'Tag and manifest versions differ.' }
          $archive = Join-Path $env:GITHUB_WORKSPACE "release-tools/releases/ICGNS-$version.zip"
          $notes = Join-Path $env:GITHUB_WORKSPACE "release-tools/docs/RELEASE-$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Release notes are missing.' }
          & ./release-tools/scripts/Test-ReleasePackage.ps1 -PackagePath $archive -ProjectRoot ./source
          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Publish the mod ZIP with GitHub's automatic source archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          MOD_ARCHIVE: ${{ steps.package.outputs.archive }}
          RELEASE_NOTES: ${{ steps.package.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json; then
            if jq -e --arg name "ICGNS-$RELEASE_VERSION.zip" '.assets[] | select(.name == $name)' release-assets.json > /dev/null; then
              mkdir existing-package
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "ICGNS-$RELEASE_VERSION.zip" --dir existing-package
              cmp "$MOD_ARCHIVE" "existing-package/ICGNS-$RELEASE_VERSION.zip"
            else
              gh release upload "$RELEASE_TAG" "$MOD_ARCHIVE" --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "I Can't Get No Sleep $RELEASE_VERSION" --notes-file "$RELEASE_NOTES" \
              --draft=false --prerelease=false --latest
            if jq -e --arg name "ICGNS-$RELEASE_VERSION-source.zip" '.assets[] | select(.name == $name)' release-assets.json > /dev/null; then
              gh release delete-asset "$RELEASE_TAG" "ICGNS-$RELEASE_VERSION-source.zip" \
                --repo "$GITHUB_REPOSITORY" --yes
            fi
          else
            gh release create "$RELEASE_TAG" "$MOD_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "I Can't Get No Sleep $RELEASE_VERSION" \
              --notes-file "$RELEASE_NOTES" --latest
          fi
